<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#536273}.label{font-size:12px}.small{font-size:10px;fill:#536273}.value{font-size:12px;font-weight:700}.big{font-size:15px;font-weight:700}</style><text x="34" y="39" class="title">5 — why MPrime needs a better validation set</text><text x="34" y="63" class="sub">Orange is the test score of the checkpoint chosen by validation. Blue is the best test score observed retrospectively; the gap is selection regret, not a trainable oracle.</text><line x1="330.0" y1="120.0" x2="330.0" y2="465.0" stroke="#d9e0e7" stroke-width="1"/><text x="330.0" y="490.0" class="small" text-anchor="middle">8</text><line x1="423.3" y1="120.0" x2="423.3" y2="465.0" stroke="#d9e0e7" stroke-width="1"/><text x="423.3" y="490.0" class="small" text-anchor="middle">10</text><line x1="516.7" y1="120.0" x2="516.7" y2="465.0" stroke="#d9e0e7" stroke-width="1"/><text x="516.7" y="490.0" class="small" text-anchor="middle">12</text><line x1="610.0" y1="120.0" x2="610.0" y2="465.0" stroke="#d9e0e7" stroke-width="1"/><text x="610.0" y="490.0" class="small" text-anchor="middle">14</text><line x1="703.3" y1="120.0" x2="703.3" y2="465.0" stroke="#d9e0e7" stroke-width="1"/><text x="703.3" y="490.0" class="small" text-anchor="middle">16</text><line x1="796.7" y1="120.0" x2="796.7" y2="465.0" stroke="#d9e0e7" stroke-width="1"/><text x="796.7" y="490.0" class="small" text-anchor="middle">18</text><line x1="890.0" y1="120.0" x2="890.0" y2="465.0" stroke="#d9e0e7" stroke-width="1"/><text x="890.0" y="490.0" class="small" text-anchor="middle">20</text><text x="315.0" y="154.0" class="label" text-anchor="end">Stage 1 / VH-off</text><line x1="656.7" y1="150.0" x2="801.3" y2="150.0" stroke="#8b98a5" stroke-width="4"/><circle cx="656.7" cy="150.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="801.3" cy="150.0" r="7.0" fill="#1769aa" stroke="white"/><text x="920.0" y="154.0" class="small" text-anchor="start">loses 3.1 plans; 12% tied at validation max</text><text x="315.0" y="207.0" class="label" text-anchor="end">Stage 1 / VH-on</text><line x1="638.0" y1="203.0" x2="754.7" y2="203.0" stroke="#8b98a5" stroke-width="4"/><circle cx="638.0" cy="203.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="754.7" cy="203.0" r="7.0" fill="#1769aa" stroke="white"/><text x="920.0" y="207.0" class="small" text-anchor="start">loses 2.5 plans; 10% tied at validation max</text><text x="315.0" y="260.0" class="label" text-anchor="end">Stage 2 validation / VH-off</text><line x1="666.0" y1="256.0" x2="754.7" y2="256.0" stroke="#8b98a5" stroke-width="4"/><circle cx="666.0" cy="256.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="754.7" cy="256.0" r="7.0" fill="#1769aa" stroke="white"/><text x="920.0" y="260.0" class="small" text-anchor="start">loses 1.9 plans; 100% tied at validation max</text><text x="315.0" y="313.0" class="label" text-anchor="end">Stage 2 validation / VH-on</text><line x1="666.0" y1="309.0" x2="787.3" y2="309.0" stroke="#8b98a5" stroke-width="4"/><circle cx="666.0" cy="309.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="787.3" cy="309.0" r="7.0" fill="#1769aa" stroke="white"/><text x="920.0" y="313.0" class="small" text-anchor="start">loses 2.6 plans; 100% tied at validation max</text><text x="315.0" y="366.0" class="label" text-anchor="end">Stage 2 terminal / VH-off</text><line x1="610.0" y1="362.0" x2="750.0" y2="362.0" stroke="#8b98a5" stroke-width="4"/><circle cx="610.0" cy="362.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="750.0" cy="362.0" r="7.0" fill="#1769aa" stroke="white"/><text x="920.0" y="366.0" class="small" text-anchor="start">loses 3.0 plans; 100% tied at validation max</text><text x="315.0" y="419.0" class="label" text-anchor="end">Stage 2 terminal / VH-on</text><line x1="633.3" y1="415.0" x2="750.0" y2="415.0" stroke="#8b98a5" stroke-width="4"/><circle cx="633.3" cy="415.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="750.0" cy="415.0" r="7.0" fill="#1769aa" stroke="white"/><text x="920.0" y="419.0" class="small" text-anchor="start">loses 2.5 plans; 100% tied at validation max</text><circle cx="335.0" cy="545.0" r="7.0" fill="#e07a1f" stroke="white"/><text x="350.0" y="549.0" class="small" text-anchor="start">validation-selected test score</text><circle cx="545.0" cy="545.0" r="7.0" fill="#1769aa" stroke="white"/><text x="560.0" y="549.0" class="small" text-anchor="start">best observed test score</text><text x="810.0" y="549.0" class="sub" text-anchor="start">Stage 2: 100% tied means validation supplied no checkpoint ranking at all.</text></svg>