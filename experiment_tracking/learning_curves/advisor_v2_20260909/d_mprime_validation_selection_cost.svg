<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b}.title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#536273}.label{font-size:12px}.small{font-size:10px;fill:#536273}.value{font-size:12px;font-weight:700}.cell{font-size:11px;font-weight:600}</style><text x="32" y="38" class="title">D — what MPrime validation selection actually costs</text><text x="32" y="62" class="sub">Dumbbells compare the checkpoint selected by validation with the best test checkpoint observed retrospectively. The right panel shows why Stage 2 cannot rank snapshots.</text><line x1="285.0" y1="125.0" x2="285.0" y2="485.0" stroke="#d9e0e7" stroke-width="1"/><text x="285.0" y="507.0" class="small" text-anchor="middle">8</text><line x1="368.3" y1="125.0" x2="368.3" y2="485.0" stroke="#d9e0e7" stroke-width="1"/><text x="368.3" y="507.0" class="small" text-anchor="middle">10</text><line x1="451.7" y1="125.0" x2="451.7" y2="485.0" stroke="#d9e0e7" stroke-width="1"/><text x="451.7" y="507.0" class="small" text-anchor="middle">12</text><line x1="535.0" y1="125.0" x2="535.0" y2="485.0" stroke="#d9e0e7" stroke-width="1"/><text x="535.0" y="507.0" class="small" text-anchor="middle">14</text><line x1="618.3" y1="125.0" x2="618.3" y2="485.0" stroke="#d9e0e7" stroke-width="1"/><text x="618.3" y="507.0" class="small" text-anchor="middle">16</text><line x1="701.7" y1="125.0" x2="701.7" y2="485.0" stroke="#d9e0e7" stroke-width="1"/><text x="701.7" y="507.0" class="small" text-anchor="middle">18</text><line x1="785.0" y1="125.0" x2="785.0" y2="485.0" stroke="#d9e0e7" stroke-width="1"/><text x="785.0" y="507.0" class="small" text-anchor="middle">20</text><text x="270.0" y="164.0" class="label" text-anchor="end">Stage 1 / VH-off</text><line x1="576.7" y1="160.0" x2="705.8" y2="160.0" stroke="#8b98a5" stroke-width="4"/><circle cx="576.7" cy="160.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="705.8" cy="160.0" r="7.0" fill="#1769aa" stroke="white"/><text x="715.8" y="164.0" class="small" text-anchor="start">regret 3.1</text><text x="270.0" y="219.0" class="label" text-anchor="end">Stage 1 / VH-on</text><line x1="560.0" y1="215.0" x2="664.2" y2="215.0" stroke="#8b98a5" stroke-width="4"/><circle cx="560.0" cy="215.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="664.2" cy="215.0" r="7.0" fill="#1769aa" stroke="white"/><text x="674.2" y="219.0" class="small" text-anchor="start">regret 2.5</text><text x="270.0" y="274.0" class="label" text-anchor="end">S2 validation / VH-off</text><line x1="585.0" y1="270.0" x2="664.2" y2="270.0" stroke="#8b98a5" stroke-width="4"/><circle cx="585.0" cy="270.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="664.2" cy="270.0" r="7.0" fill="#1769aa" stroke="white"/><text x="674.2" y="274.0" class="small" text-anchor="start">regret 1.9</text><text x="270.0" y="329.0" class="label" text-anchor="end">S2 validation / VH-on</text><line x1="585.0" y1="325.0" x2="693.3" y2="325.0" stroke="#8b98a5" stroke-width="4"/><circle cx="585.0" cy="325.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="693.3" cy="325.0" r="7.0" fill="#1769aa" stroke="white"/><text x="703.3" y="329.0" class="small" text-anchor="start">regret 2.6</text><text x="270.0" y="384.0" class="label" text-anchor="end">S2 terminal / VH-off</text><line x1="535.0" y1="380.0" x2="660.0" y2="380.0" stroke="#8b98a5" stroke-width="4"/><circle cx="535.0" cy="380.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="660.0" cy="380.0" r="7.0" fill="#1769aa" stroke="white"/><text x="670.0" y="384.0" class="small" text-anchor="start">regret 3.0</text><text x="270.0" y="439.0" class="label" text-anchor="end">S2 terminal / VH-on</text><line x1="555.8" y1="435.0" x2="660.0" y2="435.0" stroke="#8b98a5" stroke-width="4"/><circle cx="555.8" cy="435.0" r="7.0" fill="#e07a1f" stroke="white"/><circle cx="660.0" cy="435.0" r="7.0" fill="#1769aa" stroke="white"/><text x="670.0" y="439.0" class="small" text-anchor="start">regret 2.5</text><text x="535.0" y="535.0" class="value" text-anchor="middle">Mean solved test instances / 20</text><circle cx="290.0" cy="570.0" r="6.0" fill="#e07a1f" stroke="white"/><text x="303.0" y="574.0" class="small" text-anchor="start">validation-selected</text><circle cx="430.0" cy="570.0" r="6.0" fill="#1769aa" stroke="white"/><text x="443.0" y="574.0" class="small" text-anchor="start">retrospective observed best</text><text x="992.5" y="110.0" class="value" text-anchor="middle">Validation discriminative power</text><text x="870.0" y="140.0" class="small" text-anchor="start">Stage 1 / VH-off</text><rect x="870.0" y="149.0" width="245.0" height="16.0" rx="3" fill="#edf1f5" stroke="#d9e0e7"/><rect x="870.0" y="149.0" width="30.4" height="16.0" rx="3" fill="#238b45" stroke="none"/><text x="1123.0" y="162.0" class="small" text-anchor="start">12% at max</text><text x="870.0" y="205.0" class="small" text-anchor="start">Stage 1 / VH-on</text><rect x="870.0" y="214.0" width="245.0" height="16.0" rx="3" fill="#edf1f5" stroke="#d9e0e7"/><rect x="870.0" y="214.0" width="25.7" height="16.0" rx="3" fill="#238b45" stroke="none"/><text x="1123.0" y="227.0" class="small" text-anchor="start">10% at max</text><text x="870.0" y="270.0" class="small" text-anchor="start">S2 validation / VH-off</text><rect x="870.0" y="279.0" width="245.0" height="16.0" rx="3" fill="#edf1f5" stroke="#d9e0e7"/><rect x="870.0" y="279.0" width="245.0" height="16.0" rx="3" fill="#c43c39" stroke="none"/><text x="1123.0" y="292.0" class="small" text-anchor="start">100% at max</text><text x="870.0" y="335.0" class="small" text-anchor="start">S2 validation / VH-on</text><rect x="870.0" y="344.0" width="245.0" height="16.0" rx="3" fill="#edf1f5" stroke="#d9e0e7"/><rect x="870.0" y="344.0" width="245.0" height="16.0" rx="3" fill="#c43c39" stroke="none"/><text x="1123.0" y="357.0" class="small" text-anchor="start">100% at max</text><text x="870.0" y="400.0" class="small" text-anchor="start">S2 terminal / VH-off</text><rect x="870.0" y="409.0" width="245.0" height="16.0" rx="3" fill="#edf1f5" stroke="#d9e0e7"/><rect x="870.0" y="409.0" width="245.0" height="16.0" rx="3" fill="#c43c39" stroke="none"/><text x="1123.0" y="422.0" class="small" text-anchor="start">100% at max</text><text x="870.0" y="465.0" class="small" text-anchor="start">S2 terminal / VH-on</text><rect x="870.0" y="474.0" width="245.0" height="16.0" rx="3" fill="#edf1f5" stroke="#d9e0e7"/><rect x="870.0" y="474.0" width="245.0" height="16.0" rx="3" fill="#c43c39" stroke="none"/><text x="1123.0" y="487.0" class="small" text-anchor="start">100% at max</text><text x="870.0" y="555.0" class="value" text-anchor="start">Stage 2: every checkpoint is at the validation maximum.</text><text x="870.0" y="576.0" class="sub" text-anchor="start">Therefore its selected checkpoint is effectively a tie-break,</text><text x="870.0" y="595.0" class="sub" text-anchor="start">not evidence of best generalization.</text><text x="32.0" y="626.0" class="sub" text-anchor="start">Takeaway: Phase B is needed because the current set creates measurable selection regret at Stage 1 and total ranking failure at Stage 2.</text></svg>