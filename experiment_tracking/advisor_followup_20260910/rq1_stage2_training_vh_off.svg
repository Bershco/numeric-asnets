<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="360" viewBox="0 0 1800 360"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#17212b}.title{font-size:23px;font-weight:700}.sub{font-size:12px;fill:#536273}.label{font-size:11px}.head{font-size:13px;font-weight:700}</style><text x="28" y="34" class="title">RQ1 — Does MCTS-guided Stage-2 training improve policy coverage?</text><text x="28" y="57" class="sub">Validation-led primary analysis only. Effects are paired by seed; lines are 95% t-intervals; pH is Holm-adjusted within each stage/cutoff family.</text><rect x="20" y="78" width="1760" height="265" rx="5" fill="#fbfcfd" stroke="#d9e0e7"/><text x="36" y="103" class="head">VH-off: Stage 2 policy - Stage 1 policy</text><line x1="435.0" y1="115" x2="435.0" y2="310" stroke="#d9e0e7" stroke-width="1"/><text x="435.0" y="326" text-anchor="middle" class="sub">-50 pp</text><line x1="685.0" y1="115" x2="685.0" y2="310" stroke="#d9e0e7" stroke-width="1"/><text x="685.0" y="326" text-anchor="middle" class="sub">-25 pp</text><line x1="935.0" y1="115" x2="935.0" y2="310" stroke="#17212b" stroke-width="1.4"/><text x="935.0" y="326" text-anchor="middle" class="sub">+0 pp</text><line x1="1185.0" y1="115" x2="1185.0" y2="310" stroke="#d9e0e7" stroke-width="1"/><text x="1185.0" y="326" text-anchor="middle" class="sub">+25 pp</text><line x1="1435.0" y1="115" x2="1435.0" y2="310" stroke="#d9e0e7" stroke-width="1"/><text x="1435.0" y="326" text-anchor="middle" class="sub">+50 pp</text><text x="423" y="137" text-anchor="end" class="label">Block Grouping / Stage 2 / endpoint</text><line x1="875.2" y1="133" x2="964.8" y2="133" stroke="#536273" stroke-width="2"/><line x1="875.2" y1="129" x2="875.2" y2="137" stroke="#536273"/><line x1="964.8" y1="129" x2="964.8" y2="137" stroke="#536273"/><circle cx="920.0" cy="133" r="4.5" fill="#c43c39"/><text x="1445" y="137" class="sub">-1.5 pp; pH=1</text><text x="423" y="171" text-anchor="end" class="label">Drone / Stage 2 / endpoint</text><line x1="871.3" y1="167" x2="1078.7" y2="167" stroke="#536273" stroke-width="2"/><line x1="871.3" y1="163" x2="871.3" y2="171" stroke="#536273"/><line x1="1078.7" y1="163" x2="1078.7" y2="171" stroke="#536273"/><circle cx="975.0" cy="167" r="4.5" fill="#238b45"/><text x="1445" y="171" class="sub">+4.0 pp; pH=1</text><text x="423" y="205" text-anchor="end" class="label">FO Counters / Stage 2 / endpoint</text><line x1="816.5" y1="201" x2="923.5" y2="201" stroke="#536273" stroke-width="2"/><line x1="816.5" y1="197" x2="816.5" y2="205" stroke="#536273"/><line x1="923.5" y1="197" x2="923.5" y2="205" stroke="#536273"/><circle cx="870.0" cy="201" r="4.5" fill="#c43c39"/><text x="1445" y="205" class="sub">-6.5 pp; pH=0.234</text><text x="423" y="239" text-anchor="end" class="label">Rover / Stage 2 / endpoint</text><line x1="935.0" y1="235" x2="935.0" y2="235" stroke="#536273" stroke-width="2"/><line x1="935.0" y1="231" x2="935.0" y2="239" stroke="#536273"/><line x1="935.0" y1="231" x2="935.0" y2="239" stroke="#536273"/><circle cx="935.0" cy="235" r="4.5" fill="#238b45"/><text x="1445" y="239" class="sub">+0.0 pp; pH=1</text><text x="423" y="273" text-anchor="end" class="label">Counters / Stage 2 / endpoint</text><line x1="639.5" y1="269" x2="1379.7" y2="269" stroke="#536273" stroke-width="2"/><line x1="639.5" y1="265" x2="639.5" y2="273" stroke="#536273"/><line x1="1379.7" y1="265" x2="1379.7" y2="273" stroke="#536273"/><circle cx="1009.6" cy="269" r="4.5" fill="#238b45"/><text x="1445" y="273" class="sub">+7.5 pp; pH=1</text><text x="435" y="348" class="sub">Left: lower coverage. Right: higher coverage. * Holm-adjusted p &lt; .05.</text></svg>